<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyParking - Inicio de Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="login-wrapper">
        <div class="login-showcase">
            <div class="showcase-content">
                <div class="logo-box">
                    <span class="logo-text">EP</span>
                </div>
                <h1 class="showcase-title">EasyParking</h1>
                <p class="showcase-subtitle">Gestión inteligente para tu parqueadero.</p>
            </div>
        </div>
        <div class="login-form-wrapper">
            <div class="form-container">
                <h2 class="form-title">Bienvenido</h2>
                <p class="form-subtitle">Inicia sesión para continuar</p>
                
                <!-- Formulario de Login -->
                <form id="loginForm" class="needs-validation" novalidate>
                    <!-- Campo NIT Empresa -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="empresa" name="empresa" required placeholder="NIT Empresa" value="">
                        <label for="empresa"><i class="fas fa-building me-2"></i>NIT Empresa</label>
                        <div class="invalid-feedback">Por favor ingrese el NIT de la empresa.</div>
                    </div>
    
                    <!-- Campo Usuario -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="usuario" name="usuario" required placeholder="Usuario">
                        <label for="usuario"><i class="fas fa-user me-2"></i>Usuario</label>
                        <div class="invalid-feedback">Por favor ingrese su usuario.</div>
                    </div>
    
                    <!-- Campo Contraseña -->
                    <div class="input-group mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Contraseña">
                            <label for="password"><i class="fas fa-lock me-2"></i>Contraseña</label>
                            <div class="invalid-feedback">Por favor ingrese su contraseña.</div>
                        </div>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="recordar">
                            <label class="form-check-label" for="recordar">Recordarme</label>
                        </div>
                        <a href="#" class="form-text text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>
    
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/login.js"></script>
</body>
</html>
