<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a237e, #3949ab, #5c6bc0);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .error-box {
      text-align: center;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      max-width: 500px;
      animation: fadeInUp 1.2s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      font-size: 8rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 0.5rem;
    }

    .error-message {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #e0e0e0;
    }

    .error-svg {
      width: 180px;
      margin: 1.5rem auto;
      opacity: 0.9;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .btn-glow {
      background-color: #fff;
      color: #1a237e;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 0.75rem 2rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .btn-glow:hover {
      background-color: #e3e3ff;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.7);
    }

    footer {
      position: absolute;
      bottom: 10px;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    a.footer-link {
      color: #fff;
      text-decoration: underline;
      transition: color 0.2s;
    }

    a.footer-link:hover {
      color: #b3c2ff;
    }
  </style>
</head>

<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <div class="error-message">¡Ups! Página no encontrada</div>
    <img src="https://www.svgrepo.com/show/367095/astronaut.svg" alt="Astronauta perdido" class="error-svg">
    <p>La página que estás buscando puede haber sido movida o eliminada.</p>
    <a href="/" class="btn btn-glow mt-3">Volver al Inicio</a>
  </div>

  <footer>
    &copy; <span id="year"></span> <a href="https://lenixpantoja.com" class="footer-link" target="_blank">lenixpantoja.com</a> — Todos los derechos reservados
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
